name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.0"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev,sqlite]"
      - name: 静态检查
        run: ruff check src tests
      - name: 离线评测
        run: python -m tests.evaluators.run_eval --offline
      - name: 单元与集成测试
        run: pytest -m "not live_llm and not live_datasource"
