name: data-analysis-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  backend-init:
    image: ${BACKEND_IMAGE:-data-analysis-agent-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: ${INSTALL_EXTRAS:-connectors,documents,structured}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p /app/data/cache/datasource /app/data/chroma /app/data/skills
        /app/data/system-knowledge /home/app/.cache /app/logs &&
        chown -R 10001:10001 /app/data /home/app/.cache /app/logs
    volumes:
      - ./data/backend:/app/data
      - ./data/model-cache:/home/app/.cache
      - ./logs/backend:/app/logs
    restart: "no"
    networks:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-data-analysis-agent-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: ${INSTALL_EXTRAS:-connectors,documents,structured}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      ENV: prod
      APP_CONFIG_PATH: /app/config/app.yaml
      LOG_FORMAT: json
      LOG_FILE: /app/logs/app.log
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?请在 .env 中设置 REDIS_URL}
      VECTOR_STORE_TYPE: chroma
      CHROMA_PERSIST_DIR: /app/data/chroma
      DATASOURCE_CACHE_BACKEND: redis
      DATASOURCE_CACHE_DIR: /app/data/cache/datasource
      MANAGED_SKILLS_DIR: /app/data/skills
      SYSTEM_KNOWLEDGE_DIRS: /app/data/system-knowledge
      MCP_CONFIG_PATH: /app/config/app.yaml
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?请在 .env 中设置 CREDENTIAL_ENCRYPTION_KEY}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?首次部署必须设置 SUPER_ADMIN_PASSWORD}
    expose:
      - "8000"
    volumes:
      - ./config/app.yaml:/app/config/app.yaml:ro
      - ./config/datasources.yaml:/app/config/datasources.yaml:ro
      - ./data/backend:/app/data
      - ./data/model-cache:/home/app/.cache
      - ./logs/backend:/app/logs
    depends_on:
      backend-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    networks:
      - backend

  frontend:
    image: ${FRONTEND_IMAGE:-data-analysis-agent-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
